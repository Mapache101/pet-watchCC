<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Cruz Pet Watch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<nav class="navbar">
<h1>🐾 Santa Cruz Pet Watch</h1>
<div class="nav-links">
<a href="#reports">Pet Reports</a>
<a href="#report-form">Report a Pet</a>
</div>
</nav>
</header>
<main>
<section class="hero">
<h2>Help Bring Lost Pets Home</h2>
<p>
Find lost and found pets around Santa Cruz de la Sierra.
Browse reports and help reunite pets with their families.
</p>
</section>
<section id="reports" class="reports-section">
<h2>Pet Reports</h2>
<div class="filters">
<div>
<label for="status-filter">Status</label>
<select id="status-filter">
<option value="all">All</option>
<option value="Lost">Lost</option>
<option value="Found">Found</option>
</select>
</div>
<div>
<label for="area-filter">Area</label>
<select id="area-filter">
<option value="all">All Areas</option>
<option value="Equipetrol">Equipetrol</option>
<option value="Urubó">Urubó</option>
<option value="Sirari">Sirari</option>
<option value="Plan 3000">Plan 3000</option>
</select>
</div>
</div>
<div id="pet-container" class="pet-grid">
<!-- Pet cards are generated with JavaScript -->
</div>
</section>
<section id="report-form" class="form-section">
<h2>Report a Pet</h2>
<form id="pet-form">
<div class="form-group">
<label for="pet-status">Status</label>
<select id="pet-status" name="status" required>
<option value="">Select status</option>
<option value="Lost">Lost</option>
<option value="Found">Found</option>
</select>
</div>
<div class="form-group">
<label for="image-url">Image URL</label>
<input
type="url"
id="image-url"
name="imageUrl"
placeholder="https://example.com/pet.jpg"
required
>
</div>
<div class="form-group">
<label for="pet-area">Area</label>
<select id="pet-area" name="area" required>
<option value="">Select area</option>
<option value="Equipetrol">Equipetrol</option>
<option value="Urubó">Urubó</option>
<option value="Sirari">Sirari</option>
<option value="Plan 3000">Plan 3000</option>
</select>
</div>
<div class="form-group">
<label for="contact">Contact Information</label>
<input
type="text"
id="contact"
name="contact"
placeholder="Phone number or email"
required
>
</div>
<div class="form-group">
<label for="description">Description</label>
<textarea
id="description"
></textarea>
</div>
<button type="submit">Submit Report</button>
</form>
<p id="form-message"></p>
</section>
</main>
<footer>
<p>&copy; 2026 Santa Cruz Pet Watch</p>
</footer>
<script src="script.js"></script>
</body>
</html>
