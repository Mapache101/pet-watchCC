<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Watch - Reportar y Encontrar Mascotas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-paw"></i>
            <h1>Pet Watch</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#mascotas">Mascotas</a></li>
                <li><a href="#reportar">Reportar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inicio" class="hero">
            <h2>Ayúdanos a reunirlos</h2>
            <p>Una plataforma comunitaria para encontrar y reportar mascotas perdidas.</p>
        </section>

        <section id="reportar" class="form-section">
            <h3>Reportar una Mascota</h3>
            <form id="pet-form">
                <div class="form-group">
                    <label for="pet-name">Nombre de la mascota (si se conoce):</label>
                    <input type="text" id="pet-name" placeholder="Ej. Firulais">
                </div>

                <div class="form-group">
                    <label for="pet-status">Estado:</label>
                    <select id="pet-status" required>
                        <option value="perdido">Perdido</option>
                        <option value="encontrado">Encontrado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pet-type">Tipo de animal:</label>
                    <select id="pet-type" required>
                        <option value="perro">Perro</option>
                        <option value="gato">Gato</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pet-desc">Descripción (color, raza, señas particulares):</label>
                    <textarea id="pet-desc" rows="3" required placeholder="Describe a la mascota..."></textarea>
                </div>

                <div class="form-group">
                    <label for="pet-contact">Contacto (teléfono o correo):</label>
                    <input type="text" id="pet-contact" required placeholder="Tu número o email">
                </div>

                <div class="form-group">
                    <label for="pet-photo">Foto de la mascota:</label>
                    <input type="file" id="pet-photo" accept="image/*" required>
                </div>

                <button type="submit" id="submit-btn">Publicar Reporte</button>
            </form>
        </section>

        <section id="mascotas" class="pets-section">
            <h3>Mascotas Reportadas</h3>
            <div id="pets-grid" class="pets-grid">
                <!-- Se cargan dinámicamente desde Firestore -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pet Watch. Todos los derechos reservados.</p>
    </footer>

    <!-- Cargado como módulo ES6 -->
    <script type="module" src="script.js"></script>
</body>
</html>
